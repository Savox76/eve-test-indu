name: Windows design preview release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-v0.0.1-preview.1
  cancel-in-progress: false

jobs:
  release-preflight:
    name: release-preflight
    if: "${{ startsWith(github.event.head_commit.message, 'release: v0.0.1-preview.1') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout complete release history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate release source
        run: |
          python scripts/check_repository_policy.py
          npm run typecheck
          npm test
          npm run build

      - name: Scan release history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  windows-preview:
    name: windows-preview-installer
    if: "${{ startsWith(github.event.head_commit.message, 'release: v0.0.1-preview.1') }}"
    needs: release-preflight
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      RELEASE_TAG: v0.0.1-preview.1
      RELEASE_TITLE: New Eden Foundry v0.0.1-preview.1
      RELEASE_NOTES: docs/releases/v0.0.1-preview.1.md
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Confirm toolchain
        shell: pwsh
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version

      - name: Install locked dependencies
        run: npm ci

      - name: Validate release source
        shell: pwsh
        run: |
          python scripts/check_repository_policy.py
          npm run typecheck
          npm test

      - name: Build NSIS installer
        run: npm run tauri build -- --bundles nsis

      - name: Publish installer directly to GitHub Release
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe")
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)."
          }

          $installer = $installers[0]
          $checksumPath = "$($installer.FullName).sha256"
          $checksum = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          "$checksum  $($installer.Name)" | Set-Content -Encoding utf8NoBOM $checksumPath

          gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $env:RELEASE_TAG --title $env:RELEASE_TITLE --notes-file $env:RELEASE_NOTES --prerelease
            if ($LASTEXITCODE -ne 0) { throw "Could not update the existing release." }
            gh release upload $env:RELEASE_TAG $installer.FullName $checksumPath --clobber
            if ($LASTEXITCODE -ne 0) { throw "Could not upload the release files." }
          } else {
            gh release create $env:RELEASE_TAG $installer.FullName $checksumPath --target $env:GITHUB_SHA --title $env:RELEASE_TITLE --notes-file $env:RELEASE_NOTES --prerelease
            if ($LASTEXITCODE -ne 0) { throw "Could not create the release." }
          }
