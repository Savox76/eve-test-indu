name: Application quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: frontend-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install locked dependencies
        run: npm ci

      - name: Install backend runtime dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements-runtime.txt

      - name: Check release metadata
        run: python scripts/check_repository_policy.py

      - name: Compile-check Python backend
        run: npm run check:backend

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run frontend and backend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  windows-package:
    name: windows-package
    runs-on: windows-2025
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Confirm Rust toolchain
        shell: pwsh
        run: |
          rustc --version
          cargo --version

      - name: Normalize generated Rust files on the release branch
        if: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/desktop-core-runtime' }}"
        shell: pwsh
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml
          cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
          if ((git status --porcelain -- src-tauri/src/lib.rs src-tauri/Cargo.lock).Count -gt 0) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src-tauri/src/lib.rs src-tauri/Cargo.lock
            git commit -m "chore: normalize Rust sources"
            git push origin "HEAD:$env:HEAD_BRANCH"
          }

      - name: Install locked dependencies
        run: npm ci

      - name: Build and test bundled sidecar
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements-build.txt
          python scripts/build_sidecar.py --target-triple x86_64-pc-windows-msvc
          python scripts/smoke_sidecar.py --executable src-tauri/binaries/foundry-sidecar-x86_64-pc-windows-msvc.exe

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Build ephemeral NSIS package
        run: npm run tauri build -- --bundles nsis

      - name: Build ephemeral portable package
        shell: pwsh
        run: |
          $version = node --print "require('./package.json').version"
          ./scripts/package_portable.ps1 -Version $version -Architecture x64

      - name: Verify installer and portable package
        shell: pwsh
        run: |
          $version = node --print "require('./package.json').version"
          $installers = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe")
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)."
          }

          $portablePath = "src-tauri/target/release/bundle/New.Eden.Foundry_${version}_x64-portable.zip"
          if (-not (Test-Path -LiteralPath $portablePath -PathType Leaf)) {
            throw "Missing portable package: $portablePath"
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $resolvedPortablePath = (Resolve-Path -LiteralPath $portablePath).Path
          $archive = [IO.Compression.ZipFile]::OpenRead($resolvedPortablePath)
          try {
            $folder = "New Eden Foundry $version/"
            $entries = @($archive.Entries | ForEach-Object { $_.FullName.Replace('\', '/') })
            foreach ($expected in @(
              "${folder}New Eden Foundry.exe",
              "${folder}foundry-sidecar.exe",
              "${folder}PORTABLE-README-DE-EN.txt"
            )) {
              if ($expected -notin $entries) {
                throw "Portable package is missing: $expected"
              }
            }
          }
          finally {
            $archive.Dispose()
          }

          Write-Output "Validated installer and portable ZIP; workflow output remains ephemeral."
