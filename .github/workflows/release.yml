name: Windows release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release_preflight:
    name: release-preflight
    if: "${{ startsWith(github.event.head_commit.message, 'release: v') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      release_version: ${{ steps.release_metadata.outputs.version }}
      release_tag: ${{ steps.release_metadata.outputs.tag }}
      release_notes: ${{ steps.release_metadata.outputs.notes }}
      release_channel: ${{ steps.release_metadata.outputs.channel }}
    steps:
      - name: Checkout complete release history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Derive and verify release metadata
        id: release_metadata
        shell: bash
        run: |
          version="$(node --print "require('./package.json').version")"
          tag="v${version}"
          notes="docs/releases/${tag}.md"
          subject="$(git log -1 --pretty=%s)"

          if [[ "${subject}" != "release: ${tag}"* ]]; then
            echo "Release commit must start with 'release: ${tag}'." >&2
            exit 1
          fi
          if [[ ! -f "${notes}" ]]; then
            echo "Missing release notes: ${notes}" >&2
            exit 1
          fi

          channel="stable"
          if [[ "${version}" == *-* ]]; then
            channel="prerelease"
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "notes=${notes}" >> "${GITHUB_OUTPUT}"
          echo "channel=${channel}" >> "${GITHUB_OUTPUT}"

      - name: Install locked dependencies
        run: npm ci

      - name: Install backend runtime dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements-runtime.txt

      - name: Validate release source
        run: |
          python scripts/check_repository_policy.py
          npm run check:backend
          npm run typecheck
          npm test
          npm run build

      - name: Scan release history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  windows_release:
    name: windows-installer-and-portable
    needs: release_preflight
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      RELEASE_VERSION: ${{ needs.release_preflight.outputs.release_version }}
      RELEASE_TAG: ${{ needs.release_preflight.outputs.release_tag }}
      RELEASE_NOTES: ${{ needs.release_preflight.outputs.release_notes }}
      RELEASE_CHANNEL: ${{ needs.release_preflight.outputs.release_channel }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Confirm toolchain
        shell: pwsh
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version

      - name: Install locked dependencies
        run: npm ci

      - name: Build and test bundled sidecar
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements-build.txt
          python scripts/build_sidecar.py --target-triple x86_64-pc-windows-msvc
          python scripts/smoke_sidecar.py --executable src-tauri/binaries/foundry-sidecar-x86_64-pc-windows-msvc.exe

      - name: Scan bundled sidecar with Microsoft Defender
        shell: pwsh
        run: |
          ./scripts/scan_windows_packages.ps1 -Paths @(
            'src-tauri/binaries'
          )

      - name: Validate release source
        shell: pwsh
        run: |
          python scripts/check_repository_policy.py
          npm run check:backend
          npm run typecheck
          npm test

      - name: Build NSIS installer
        run: npm run tauri build -- --bundles nsis

      - name: Smoke-test installed application and migration
        shell: pwsh
        run: |
          $installerCandidates = @(Get-ChildItem -LiteralPath 'src-tauri/target/release/bundle/nsis' `
            -Filter "*_${env:RELEASE_VERSION}_x64-setup.exe")
          if ($installerCandidates.Count -ne 1) { throw 'Expected exactly one NSIS installer.' }
          $installerPath = $installerCandidates[0].FullName
          ./scripts/smoke_installed_application.ps1 -InstallerPath $installerPath

      - name: Build portable ZIP
        shell: pwsh
        run: ./scripts/package_portable.ps1 -Version $env:RELEASE_VERSION -Architecture x64

      - name: Scan public packages with Microsoft Defender
        shell: pwsh
        run: |
          $installerCandidates = @(Get-ChildItem -LiteralPath 'src-tauri/target/release/bundle/nsis' `
            -Filter "*_${env:RELEASE_VERSION}_x64-setup.exe")
          if ($installerCandidates.Count -ne 1) { throw 'Expected exactly one NSIS installer.' }
          ./scripts/scan_windows_packages.ps1 -Paths @(
            $installerCandidates[0].FullName,
            "src-tauri/target/release/bundle/New.Eden.Foundry_${env:RELEASE_VERSION}_x64-portable.zip"
          )

      - name: Publish Windows packages directly to GitHub Release
        shell: pwsh
        run: |
          $releaseFiles = @(
            ./scripts/prepare_release_files.ps1 -Version $env:RELEASE_VERSION
          )
          if ($releaseFiles.Count -ne 4) {
            throw "Expected installer, portable ZIP and two checksums."
          }

          $releaseTitle = "New Eden Foundry $($env:RELEASE_TAG)"
          gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($env:RELEASE_CHANNEL -eq "prerelease") {
              gh release edit $env:RELEASE_TAG --title $releaseTitle --notes-file $env:RELEASE_NOTES --prerelease
            } else {
              gh release edit $env:RELEASE_TAG --title $releaseTitle --notes-file $env:RELEASE_NOTES --prerelease=false --latest
            }
            if ($LASTEXITCODE -ne 0) { throw "Could not update the existing release." }
            gh release upload $env:RELEASE_TAG @releaseFiles --clobber
            if ($LASTEXITCODE -ne 0) { throw "Could not upload the release files." }
          } else {
            if ($env:RELEASE_CHANNEL -eq "prerelease") {
              gh release create $env:RELEASE_TAG @releaseFiles --target $env:GITHUB_SHA --title $releaseTitle --notes-file $env:RELEASE_NOTES --prerelease
            } else {
              gh release create $env:RELEASE_TAG @releaseFiles --target $env:GITHUB_SHA --title $releaseTitle --notes-file $env:RELEASE_NOTES --latest
            }
            if ($LASTEXITCODE -ne 0) { throw "Could not create the release." }
          }
