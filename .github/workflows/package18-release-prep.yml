name: Package 18 release preparation

on:
  push:
    branches:
      - release/v0.0.5-preview.2

permissions:
  contents: write

jobs:
  prepare:
    if: "${{ !startsWith(github.event.head_commit.message, 'release: v0.0.5-preview.2') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout release branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: release/v0.0.5-preview.2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Prepare release metadata and version files
        run: python scripts/prepare_package18_release.py

      - name: Commit prepared release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Release preparation produced no changes." >&2
            exit 1
          fi
          git commit -m "release: v0.0.5-preview.2 (Pakete 17-18)" -m "Minimaler SDE-Import und vollständiger Multi-Character-Asset-Sync mit Pagination und vollständigen Snapshot-Grenzen."
          git push origin HEAD:release/v0.0.5-preview.2
