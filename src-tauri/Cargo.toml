[package]
name = "new-eden-foundry"
version = "0.0.5-preview.15"
description = "Local-first EVE Online industry planning desktop application"
authors = ["New Eden Foundry contributors"]
edition = "2021"
repository = "https://github.com/Savox76/eve-test-indu"

[lib]
name = "new_eden_foundry_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "=2.4.4"
